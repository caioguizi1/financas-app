# Tags e releases automáticas: a cada push na main, cria a tag vX.Y.Z e a release
# de toda versão do README que ainda não tem (inclusive as antigas, na 1ª vez).
name: Versões
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: versoes
  cancel-in-progress: false
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Criar tags e releases que faltam
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/versoes.mjs
