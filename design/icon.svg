<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A8CFF"/><stop offset=".55" stop-color="#6E5CF0"/><stop offset="1" stop-color="#3F32C4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1B1460" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
